<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 知识图谱管理系统</title>
  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>知识图谱管理系统</h1>
        <p>Knowledge Graph Management System</p>
      </div>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-input" id="username" placeholder="请输入用户名" value="admin">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="password" placeholder="请输入密码" value="123456">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">登录</button>
      </form>
      <div class="login-tips">
        <p>演示账号：admin / 123456</p>
      </div>
    </div>
  </div>
  <script src="../../assets/js/utils.js"></script>
  <script src="login.js"></script>
</body>
</html>
